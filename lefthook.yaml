pre-commit:
  commands:
    lint:
      glob: '*.{js,ts,vue}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

    typecheck:
      glob: '*.{ts,vue}'
      run: pnpm typecheck

    test:
      glob: '{src,scripts}/**/*.{ts,vue}'
      run: pnpm exec vitest related --run --passWithNoTests {staged_files}
