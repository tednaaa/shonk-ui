<script>
	try {
		const palette = JSON.parse(localStorage.getItem('shonk-ui/storybook-palette'));
		const root = document.documentElement;

		if (palette) {
			root.classList.toggle('dark', palette.base === 'dark');

			if (palette.preset)
				root.dataset.theme = palette.preset;

			root.style.background = palette.colors.background;

			for (const [name, color] of Object.entries(palette.colors))
				root.style.setProperty(`--sb-saved-${name}`, color);
		}
	}
	catch {}
</script>
